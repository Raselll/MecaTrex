name: Validate MECATREX feature branch

on:
  push:
    branches:
      - feature/auth-provider-admin
    paths:
      - app/**
      - components/**
      - lib/**
      - package.json
      - package-lock.json
      - next.config.ts
      - .github/workflows/validate-feature.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
