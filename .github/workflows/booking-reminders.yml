name: MECATREX 24-hour booking reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send due MECATREX reminders
        env:
          MECATREX_REMINDER_URL: ${{ secrets.MECATREX_REMINDER_URL }}
          MECATREX_CRON_SECRET: ${{ secrets.MECATREX_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MECATREX_REMINDER_URL:-}" || -z "${MECATREX_CRON_SECRET:-}" ]]; then
            echo "Booking reminders are not configured yet; skipping scheduled invocation."
            exit 0
          fi
          if [[ "$MECATREX_REMINDER_URL" != https://* ]]; then
            echo "MECATREX_REMINDER_URL must be an HTTPS production site."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            --retry 2 --retry-delay 5 \
            --header "Authorization: Bearer ${MECATREX_CRON_SECRET}" \
            "${MECATREX_REMINDER_URL%/}/api/cron/booking-reminders"
